<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">How AnvilCV works</title>
  <desc id="d">Two lanes. Build the bank: import a GitHub repo, map and explore the code, find its strongest stories, write and filter bullets per story and lens, triage the bank. Tailor per job: paste a job description, pull keywords and a lens, pre-filter and rank bullets, select one page and build the PDF, track the outcome.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#1b1f24; --muted:#57606a; --line:#8c959f; --box:#f6f8fa; --stroke:#d0d7de;
            --llm:#ddf4ff; --llm-s:#54aeff; --chk:#dafbe1; --chk-s:#4ac26b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#e6edf3; --muted:#8d96a0; --line:#6e7681; --box:#161b22; --stroke:#30363d;
              --llm:#0c2d6b; --llm-s:#1f6feb; --chk:#0f2e1a; --chk-s:#2ea043; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; }
    .llm { fill: var(--llm); stroke: var(--llm-s); stroke-width: 1.5; }
    .chk { fill: var(--chk); stroke: var(--chk-s); stroke-width: 1.5; }
    .lane { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .note { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
    .h { font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .s { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
    .arrow { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#a); }
    .ah { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="420"/>

  <!-- Lane 1: build the bank (once per project) -->
  <text class="lane" x="20" y="30">1 · Build the bullet bank</text>
  <text class="note" x="210" y="30">once per project · or type project info by hand</text>

  <rect class="box" x="20" y="48" width="172" height="84" rx="8"/>
  <text class="h" x="34" y="74">Import repo</text>
  <text class="s" x="34" y="98">GitHub App, read-only</text>
  <text class="s" x="34" y="116">private repos OK</text>

  <rect class="llm" x="206" y="48" width="172" height="84" rx="8"/>
  <text class="h" x="220" y="74">Map + explore</text>
  <text class="s" x="220" y="98">ranked modules, counted</text>
  <text class="s" x="220" y="116">facts, AI reads files</text>

  <rect class="llm" x="392" y="48" width="172" height="84" rx="8"/>
  <text class="h" x="406" y="74">Find stories</text>
  <text class="s" x="406" y="98">strongest work, quotes</text>
  <text class="s" x="406" y="116">checked against source</text>

  <rect class="llm" x="578" y="48" width="172" height="84" rx="8"/>
  <text class="h" x="592" y="74">Write + filter</text>
  <text class="s" x="592" y="98">1-2 per story and lens;</text>
  <text class="s" x="592" y="116">filters + 1 repair pass</text>

  <rect class="chk" x="764" y="48" width="172" height="84" rx="8"/>
  <text class="h" x="778" y="74">Bullet bank</text>
  <text class="s" x="778" y="98">approve / reject, each</text>
  <text class="s" x="778" y="116">linked to its source</text>

  <path class="arrow" d="M192,90 H202"/>
  <path class="arrow" d="M378,90 H388"/>
  <path class="arrow" d="M564,90 H574"/>
  <path class="arrow" d="M750,90 H760"/>

  <!-- bank feeds ranking -->
  <path class="arrow" d="M850,132 V180 H478 V232"/>
  <text class="note" x="560" y="174">approved + pending bullets</text>

  <!-- Lane 2: tailor per job -->
  <text class="lane" x="20" y="212">2 · Tailor per job</text>
  <text class="note" x="160" y="212">1-3 min per application</text>

  <rect class="box" x="20" y="236" width="172" height="84" rx="8"/>
  <text class="h" x="34" y="262">Paste job</text>
  <text class="s" x="34" y="286">text or posting URL</text>
  <text class="s" x="34" y="304">(JSON-LD parsed)</text>

  <rect class="llm" x="206" y="236" width="172" height="84" rx="8"/>
  <text class="h" x="220" y="262">Read JD</text>
  <text class="s" x="220" y="286">AI pulls keywords and</text>
  <text class="s" x="220" y="304">1-2 lenses (editable)</text>

  <rect class="llm" x="392" y="236" width="172" height="84" rx="8"/>
  <text class="h" x="406" y="262">Rank bullets</text>
  <text class="s" x="406" y="286">keyword pre-filter,</text>
  <text class="s" x="406" y="304">then AI ranking</text>

  <rect class="box" x="578" y="236" width="172" height="84" rx="8"/>
  <text class="h" x="592" y="262">Select + build</text>
  <text class="s" x="592" y="286">1 page, 1 wording/story</text>
  <text class="s" x="592" y="304">→ LaTeX PDF + letter</text>

  <rect class="chk" x="764" y="236" width="172" height="84" rx="8"/>
  <text class="h" x="778" y="262">Track</text>
  <text class="s" x="778" y="286">recruiter score,</text>
  <text class="s" x="778" y="304">outcomes + LLM cost</text>

  <path class="arrow" d="M192,278 H202"/>
  <path class="arrow" d="M378,278 H388"/>
  <path class="arrow" d="M564,278 H574"/>
  <path class="arrow" d="M750,278 H760"/>

  <!-- Legend -->
  <rect class="box" x="20" y="366" width="14" height="14" rx="3"/>
  <text class="s" x="40" y="378">Plain code</text>
  <rect class="llm" x="128" y="366" width="14" height="14" rx="3"/>
  <text class="s" x="148" y="378">AI step</text>
  <rect class="chk" x="220" y="366" width="14" height="14" rx="3"/>
  <text class="s" x="240" y="378">You decide</text>
</svg>
