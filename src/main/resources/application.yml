server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${COOKIE_SAME_SITE:Lax}
        secure: ${COOKIE_SECURE:false}

spring:
  datasource:
    url:      ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

llm:
  provider: deepseek
  api-key:  ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://opencode.ai/zen/v1}
  model:
    generate: deepseek-v4-flash-free
    match:    deepseek-v4-flash-free
    clean-jd: deepseek-v4-flash-free

tectonic:
  binary: ${TECTONIC_BIN:tectonic}
  timeout-seconds: 30

auth:
  seed:
    username: ${SEED_USERNAME:f3l}
    email:    ${SEED_EMAIL:admin@localhost}
    password: ${SEED_PASSWORD:}

cors:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

# Profile now lives in DB (Flyway V2). Edit at /profile in the UI.
