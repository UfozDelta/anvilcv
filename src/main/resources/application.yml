server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${COOKIE_SAME_SITE:Lax}
        secure: ${COOKIE_SECURE:false}

spring:
  datasource:
    url:      ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      # Neon free scales to zero after 5 min idle and bills compute while awake.
      # minimum-idle defaults to maximum-pool-size, which would pin 5 connections
      # open forever and burn the 100 CU-hour/month quota. Drain instead.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      connection-timeout: 30000   # cold start after suspend takes a few seconds
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

llm:
  # The only switch. Each provider keeps its own key and models below, so all can
  # stay configured and flipping providers is this one line.
  provider: ${LLM_PROVIDER:gemini}   # gemini | opencode | openai

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model:
      generate: gemini-2.5-flash
      match:    gemini-2.5-flash
      clean-jd: gemini-2.5-flash-lite

  opencode:
    api-key:  ${OPENCODE_API_KEY:}
    base-url: ${OPENCODE_BASE_URL:https://opencode.ai/zen/v1}
    # Model ids come from GET https://opencode.ai/zen/v1/models — the docs page
    # disagrees with it, the API wins. Env-overridable because Zen's free tier
    # rotates: x-preview-f-free ("Ox Alpha Free") is a limited preview and will
    # 404 once it ends, and swapping back is then one env var, not a rebuild.
    # clean-jd stays on deepseek: JD cleanup is cheap work that does not need a
    # reasoning model's latency.
    model:
      generate: ${OPENCODE_MODEL_GENERATE:x-preview-f-free}
      match:    ${OPENCODE_MODEL_MATCH:x-preview-f-free}
      clean-jd: ${OPENCODE_MODEL_CLEAN_JD:deepseek-v4-flash-free}

  # Generic OpenAI-compatible provider. Defaults to OpenAI itself, but base-url can
  # point at OpenRouter, a local Ollama/LM Studio server, or any compatible endpoint.
  openai:
    api-key:  ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model:
      generate: gpt-4o-mini
      match:    gpt-4o-mini
      clean-jd: gpt-4o-mini

tectonic:
  binary: ${TECTONIC_BIN:tectonic}
  timeout-seconds: 30

auth:
  seed:
    username: ${SEED_USERNAME:f3l}
    email:    ${SEED_EMAIL:admin@localhost}
    password: ${SEED_PASSWORD:}

cors:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

# Profile now lives in DB (Flyway V2). Edit at /profile in the UI.
