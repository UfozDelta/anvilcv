# Two ways to host this, same file:
#  - portal (Desktop/portal): `python -m portal deploy <this dir> --host <hostname>` builds `app`, publishes
#    no ports and runs its own Cloudflare Tunnel sidecar. `cloudflared` below stays off (profile not active).
#  - standalone: put TUNNEL_TOKEN and COMPOSE_PROFILES=tunnel in .env and run deploy.bat (or
#    `docker compose up -d --build`); compose then starts `cloudflared` next to `app`.
# deploy.bat detects which one is in use. Never set COMPOSE_PROFILES=tunnel under portal: two tunnels.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # No ports: — nothing is published to the host. portal's cloudflared reaches the JVM over a
    # per-project Docker network, so the machine has no open inbound port at all.
    mem_limit: 3g   # JVM 21 is container-aware; heap caps at ~25% of this
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Standalone hosting only; inert unless the `tunnel` profile is on (see header).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
